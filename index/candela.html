```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Candela 💗💙</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: "Segoe UI", Arial, sans-serif;

    overflow: hidden;

    /* ROSA + AZUL */
    background:
        radial-gradient(circle at 10% 10%, #ff9fca 0%, transparent 30%),
        radial-gradient(circle at 90% 10%, #82b4ff 0%, transparent 30%),
        radial-gradient(circle at 5% 90%, #91bfff 0%, transparent 30%),
        radial-gradient(circle at 95% 90%, #ffafd5 0%, transparent 30%),
        linear-gradient(135deg, #ffe0ee, #d7e8ff);
}


/* DECORACIÓN */

.decoracion {
    position: absolute;
    pointer-events: none;
    user-select: none;
}


/* Corazones */

.corazon {
    font-size: 35px;
    color: #f27bb2;

    animation:
        flotar 5s ease-in-out infinite,
        aparecer 2s ease-in-out infinite alternate;
}

.azul {
    color: #659bea;
}

.c1 {
    top: 8%;
    left: 10%;
}

.c2 {
    top: 17%;
    right: 12%;
    animation-delay: 1s;
}

.c3 {
    bottom: 12%;
    left: 13%;
    animation-delay: 2s;
}

.c4 {
    bottom: 17%;
    right: 10%;
    animation-delay: 3s;
}


/* Estrellas */

.estrella {
    font-size: 25px;
    animation: brillar 2s infinite alternate;
}

.e1 {
    color: #ef75ad;
    top: 30%;
    left: 7%;
}

.e2 {
    color: #659bea;
    top: 13%;
    right: 30%;
    animation-delay: .5s;
}

.e3 {
    color: #659bea;
    bottom: 30%;
    right: 7%;
    animation-delay: 1s;
}

.e4 {
    color: #ef75ad;
    bottom: 10%;
    left: 35%;
    animation-delay: 1.5s;
}


@keyframes flotar {

    50% {
        transform: translateY(-18px) rotate(8deg);
    }

}


@keyframes aparecer {

    from {
        opacity: .4;
    }

    to {
        opacity: 1;
    }

}


@keyframes brillar {

    from {
        opacity: .3;
        transform: scale(.8);
    }

    to {
        opacity: 1;
        transform: scale(1.2);
    }

}


/* TARJETA */

.carta {

    width: 90%;
    max-width: 500px;

    padding: 55px 35px;

    text-align: center;

    position: relative;

    background: rgba(255, 255, 255, .82);

    border-radius: 35px;

    /* Borde mitad rosa mitad azul */
    border: 3px solid transparent;

    background:
        linear-gradient(rgba(255,255,255,.9), rgba(255,255,255,.9)) padding-box,
        linear-gradient(90deg, #f07ab1, #6c9eea) border-box;

    box-shadow:
        0 25px 70px rgba(80,100,160,.22);

    backdrop-filter: blur(10px);
}


/* CORAZÓN PRINCIPAL */

.corazon-grande {

    font-size: 75px;

    background: linear-gradient(
        135deg,
        #f06da9,
        #6499eb
    );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation: latir 1.7s infinite ease-in-out;

}


@keyframes latir {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.12);
    }

}


/* LÍNEA ROSA + AZUL */

.linea {

    width: 130px;
    height: 4px;

    margin: 18px auto;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #ef72ad 50%,
            #659bea 50%
        );

}


/* NOMBRE */

h1 {

    margin: 0;

    font-size: clamp(43px, 12vw, 65px);

    background:
        linear-gradient(
            90deg,
            #ed6ca7,
            #659bea
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    letter-spacing: -2px;

}


/* MENSAJE */

.mensaje {

    margin-top: 18px;

    font-size: clamp(28px, 7vw, 40px);

    color: #657aa6;

}


/* "quiero" rosa */

.mensaje span {

    color: #e86aa6;

    font-weight: 600;

}


/* DETALLES */

.detalles {

    margin-top: 28px;

    font-size: 22px;

    letter-spacing: 10px;

    color: #6d9ee8;

}


/* BRILLITOS */

.brillo {

    position: absolute;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    animation: brillo 2s infinite alternate;

}


.b1 {
    top: 25px;
    left: 30px;
    background: #f17ab1;
}

.b2 {
    top: 45px;
    right: 35px;
    background: #6c9fea;
    animation-delay: .6s;
}

.b3 {
    bottom: 35px;
    left: 50px;
    background: #6c9fea;
    animation-delay: 1s;
}

.b4 {
    bottom: 25px;
    right: 45px;
    background: #f17ab1;
    animation-delay: 1.5s;
}


@keyframes brillo {

    from {
        opacity: .2;
        transform: scale(.6);
    }

    to {
        opacity: 1;
        transform: scale(1.5);
    }

}


/* CELULAR */

@media (max-width: 450px) {

    .carta {
        padding: 45px 20px;
    }

    .corazon-grande {
        font-size: 65px;
    }

    .detalles {
        letter-spacing: 6px;
    }

}

</style>
</head>


<body>


<!-- CORAZONES -->

<div class="decoracion corazon c1">♡</div>
<div class="decoracion corazon azul c2">♡</div>
<div class="decoracion corazon azul c3">♡</div>
<div class="decoracion corazon c4">♡</div>


<!-- ESTRELLAS -->

<div class="decoracion estrella e1">✦</div>
<div class="decoracion estrella e2">✧</div>
<div class="decoracion estrella e3">✦</div>
<div class="decoracion estrella e4">✧</div>


<!-- CARTA -->

<div class="carta">

    <div class="brillo b1"></div>
    <div class="brillo b2"></div>
    <div class="brillo b3"></div>
    <div class="brillo b4"></div>

    <div class="corazon-grande">
        ♥
    </div>

    <div class="linea"></div>

    <h1>Candela</h1>

    <div class="mensaje">
        te <span>quiero</span> 💗💙
    </div>

    <div class="detalles">
        ✦ ♡ ✦ ♡ ✦
    </div>

</div>


</body>
</html>
